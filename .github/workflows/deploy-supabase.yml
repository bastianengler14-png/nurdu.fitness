
name: Deploy Supabase WhatsApp Function

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prepare function
        run: |
          mkdir -p supabase/functions/create-whatsapp-invite
          cp create-whatsapp-invite.ts supabase/functions/create-whatsapp-invite/index.ts

      - name: Deploy function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase functions deploy create-whatsapp-invite --project-ref "$PROJECT_REF"
